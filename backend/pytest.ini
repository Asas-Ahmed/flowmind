[pytest]
minversion = 9.0
addopts = -ra --strict-markers --strict-config --cov=app --cov-report=term-missing
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast isolated unit tests
    api: FastAPI endpoint tests
    integration: cross-module tests using the isolated test database
    ml: tests for the task-risk ML layer
    slow: tests that may load larger artifacts
